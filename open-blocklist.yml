apiVersion: v1
kind: Namespace
metadata:
  name: open-blocklist

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-blocklist-coredns
  namespace: open-blocklist
data:
  Corefile: |
    open-blocklist.internal {
        forward . 127.0.0.1:5353
        cache 10
        log
        errors
    }

    open-blocklist-etcd.internal {
        etcd {
            path /skydns
            endpoint http://127.0.0.1:2379
        }
        cache 10
        log
        errors
    }

    in-addr.arpa {
        etcd {
            path /skydns
            endpoint http://127.0.0.1:2379
            fallthrough
        }
        forward . /etc/resolv.conf
        cache 30
        log
        errors
    }

---
apiVersion: v1
kind: Service
metadata:
  name: open-blocklist
  namespace: open-blocklist
spec:
  clusterIP: None
  selector:
    app: open-blocklist
  ports:
    - name: lookup
      port: 8080
      targetPort: 8080
    - name: write
      port: 8090
      targetPort: 8090
    - name: metrics
      port: 9100
      targetPort: 9100
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open-blocklist
  namespace: open-blocklist
spec:
  serviceName: open-blocklist
  replicas: 3

  selector:
    matchLabels:
      app: open-blocklist

  template:
    metadata:
      labels:
        app: open-blocklist
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"

    spec:
      containers:

        - name: etcd
          image: registry.k8s.io/etcd:3.5.15-0
          command:
            - /usr/local/bin/etcd
            - --name=$(POD_NAME)
            - --data-dir=/etcd-data
            - --listen-client-urls=http://127.0.0.1:2379
            - --advertise-client-urls=http://127.0.0.1:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).open-blocklist.open-blocklist.svc.cluster.local:2380
            - --initial-cluster=open-blocklist-0=http://open-blocklist-0.open-blocklist.open-blocklist.svc.cluster.local:2380,open-blocklist-1=http://open-blocklist-1.open-blocklist.open-blocklist.svc.cluster.local:2380,open-blocklist-2=http://open-blocklist-2.open-blocklist.open-blocklist.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=open-blocklist-etcd
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2380
              name: etcd-peer
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data

        - name: open-blocklist
          image: ghcr.io/nashcom/open-blocklist:latest
          ports:
            - containerPort: 8080
              name: lookup
            - containerPort: 8090
              name: write
            - containerPort: 9100
              name: metrics
            - containerPort: 5353
              name: dns-udp
              protocol: UDP
            - containerPort: 5353
              name: dns-tcp
              protocol: TCP
          env:
            - name: OPENBL_ETCD_ENDPOINT
              value: http://127.0.0.1:2379

        - name: coredns
          image: coredns/coredns:1.11.3
          args:
            - -conf
            - /Corefile
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /Corefile
              subPath: Corefile

      volumes:
        - name: config
          configMap:
            name: open-blocklist-coredns

  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi