apiVersion: v1
kind: Namespace
metadata:
  name: open-blocklist

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-blocklist-coredns
  namespace: open-blocklist
data:
  Corefile: |
    open-blocklist.internal {
        etcd {
            path /skydns
            endpoint http://etcd:2379
        }

        cache 10
        log
        errors
    }

    in-addr.arpa {
        etcd {
            path /skydns
            endpoint http://etcd:2379
            fallthrough
        }

        forward . /etc/resolv.conf
        cache 30
        log
        errors
    }

---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: open-blocklist
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: open-blocklist
spec:
  serviceName: etcd
  replicas: 1

  selector:
    matchLabels:
      app: etcd

  template:
    metadata:
      labels:
        app: etcd

    spec:
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.5.15-0

          command:
            - /usr/local/bin/etcd
            - --advertise-client-urls=http://0.0.0.0:2379
            - --listen-client-urls=http://0.0.0.0:2379
            - --data-dir=/etcd-data

          ports:
            - containerPort: 2379
              name: client

          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data

  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: open-blocklist-dns
  namespace: open-blocklist
spec:
  selector:
    app: open-blocklist-dns

  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53

    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-blocklist-dns
  namespace: open-blocklist
spec:
  replicas: 2

  selector:
    matchLabels:
      app: open-blocklist-dns

  template:
    metadata:
      labels:
        app: open-blocklist-dns

    spec:
      containers:
        - name: coredns
          image: coredns/coredns:latest
          args:
            - -conf
            - /Corefile

          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /Corefile
              subPath: Corefile

      volumes:
        - name: config
          configMap:
            name: open-blocklist-coredns

---
apiVersion: v1
kind: Service
metadata:
  name: open-blocklist
  namespace: open-blocklist
spec:
  selector:
    app: open-blocklist

  ports:
    - name: lookup
      port: 8080
      targetPort: 8080

    - name: write
      port: 8090
      targetPort: 8090

    - name: metrics
      port: 9100
      targetPort: 9100

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-blocklist
  namespace: open-blocklist
spec:
  replicas: 2

  selector:
    matchLabels:
      app: open-blocklist

  template:
    metadata:
      labels:
        app: open-blocklist
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"

    spec:
      containers:
        - name: open-blocklist
          image: nashcom/open-blocklist:latest

          ports:
            - containerPort: 8080
              name: lookup
            - containerPort: 8090
              name: write
            - containerPort: 9100
              name: metrics

          env:
            - name: ETCD_ENDPOINT
              value: http://etcd:2379